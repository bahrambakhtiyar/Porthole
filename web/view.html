<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Shared screen · Porthole</title>
<meta name="apple-mobile-web-app-title" content="Porthole">
<link rel="icon" href="/static/icon.svg?v=ring" type="image/svg+xml">
<link rel="manifest" href="/static/manifest.json?v=ring">
<link rel="apple-touch-icon" href="/static/icon-180.png?v=ring">
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="view-page">
<main id="stage" class="stage">
  <video id="video" autoplay muted playsinline aria-label="Shared screen"></video>
  <div id="weak" class="badge" hidden><span class="dot" aria-hidden="true"></span>Weak signal</div>
  <div id="paused" class="badge paused-note" hidden>Paused</div>
  <div id="overlay" class="overlay">
    <div id="spinner" class="spinner" aria-hidden="true"></div>
    <h1 id="status" class="overlay-title">Connecting</h1>
    <p id="detail" class="overlay-detail" hidden></p>
    <p id="code" class="code" hidden></p>
    <button id="play" type="button" class="primary" hidden>Play</button>
    <button id="retry" type="button" class="primary" hidden>Try again</button>
  </div>
  <p id="say" class="visually-hidden" role="status"></p>
  <div id="bar" class="view-bar" role="group" aria-label="Controls">
    <button id="unmute" type="button" aria-pressed="false" hidden>Sound</button>
    <button id="fit" type="button" hidden>Fit</button>
    <button id="actual" type="button" aria-label="1:1, actual size" aria-pressed="false" hidden>1:1</button>
    <button id="pip" type="button" hidden>Pop out</button>
    <button id="save" type="button" aria-label="Save picture" hidden>Save</button>
    <select id="quality" aria-label="Quality">
      <option value="auto">Auto quality</option>
      <option value="high">High quality</option>
      <option value="saver">Data saver</option>
    </select>
    <button id="fullscreen" type="button" hidden>Full screen</button>
  </div>
</main>
<script type="module" src="/static/view.js"></script>
</body>
</html>
